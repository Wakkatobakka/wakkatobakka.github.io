<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% if page.layout == 'devlog-entry' %}{{ page.title | escape }} · {% endif %}Wakka’s Dev Log</title>
  <meta name="description" content="{{ page.description | default: 'The discoveries, disasters, and whatever the hell I’m working on today.' | escape }}">
  <meta property="og:title" content="{{ page.title | default: 'Wakka’s Dev Log' | escape }}">
  <meta property="og:site_name" content="Wakka’s Workshop">
  <meta property="og:type" content="{% if page.layout == 'devlog-entry' %}article{% else %}website{% endif %}">
  <link rel="canonical" href="https://wakkatobakka.github.io{{ page.url | replace: '/index.html', '/' }}">
  <link rel="stylesheet" href="{{ '/devlog/devlog.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Wakkatobakka’s Workshop">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span>wakka<span class="brand-accent">tobakka</span></span>
      </a>
      <nav aria-label="Workshop navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/devlog/' | relative_url }}"{% unless page.layout == 'devlog-entry' %} aria-current="page"{% endunless %}>Dev Log</a>
      </nav>
    </div>
  </header>
  <main class="reading-wrap" id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="site-wrap">
      <a href="{{ '/' | relative_url }}">Wakka’s Workshop</a>
    </div>
  </footer>
</body>
</html>
